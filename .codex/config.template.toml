project_doc_max_bytes = 131072

[mcp_servers.bernini]
command = @PYTHON@
env_vars = ["WS_ASK", "BERNINI_DIR", "CODEX_THREAD_ID"]
args = ["-X", "utf8", @TOOLS@]

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = @HOOK@
command_windows = @WINDOWS_HOOK@

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = @HOOK@
command_windows = @WINDOWS_HOOK@

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = @HOOK@
command_windows = @WINDOWS_HOOK@

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = @HOOK@
command_windows = @WINDOWS_HOOK@

[agents.bcp-docmap]
description = "Read-only documentation traversal with source citations."
config_file = @DOCMAP@

[agents.bcp-precheck]
description = "Read-only review of the change before opening a PR."
config_file = @PRECHECK@
