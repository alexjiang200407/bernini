name: CI

on:
  # ready_for_review is the run a draft never had: the Hub opens each feature's PR as a draft before
  # any work is on it, so a draft's pushes compile nothing until the PR is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, "release_*"]

# A PR gets one review-worthy result, not one per intermediate push.
# A draft's run skips every job, so it must not cancel the real one a ready PR has in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.event.pull_request.draft }}

jobs:
  compile:
    name: compile (ninja-msvc, Debug)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # packages: write is what lets GITHUB_TOKEN push vcpkg's binaries to this repo's feed.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/windows-msvc
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # An entry is addressed by what it was compiled from, not by this key: the key only chooses
      # which store to start from, so any earlier one is as good a start as the last. Entries are
      # scoped to the ref that saved them and a PR reads its own, then its base's, then master's,
      # which is why master and every release train build on every push: a PR's base is its train,
      # and master's store is a whole train older than that.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-msvc-${{ github.sha }}
          restore-keys: ccache-msvc-

      # The restored store carries its statistics, so unzeroed they describe every run before this
      # one too. The stamp is what the save's eviction measures an untouched object against.
      - name: Start this run's compiler cache statistics
        shell: bash
        run: |
          ccache --zero-stats
          echo "COMPILES_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Compile only: the ninja-msvc-debug preset has BUILD_TESTS=ON, so the suites are
      # built but never run -- they need a GPU and a machine this runner isn't. Qt is
      # absent, so apps/editor is skipped (CMakeLists.txt find_package(Qt6 QUIET)).
      # build.py locates vcvars via vswhere when config.json is absent, as it is here.
      - name: Build
        shell: bash
        run: python scripts/build.py --preset windows-ninja-msvc-dx12-debug -D BERNINI_MSVC_COMPILER_CACHE=ON 2>&1 | tee build.log

      # A port the feed lacks -- a new vcpkg.json entry, or an ABI hash the image moved -- is built
      # from source by this run and costs minutes, silently. Name it, so the slow run explains itself.
      - name: Report vcpkg's binary feed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          restored=$(grep -oE 'Restored [0-9]+ package' build.log | grep -oE '[0-9]+' | head -1 || true)
          built=$(grep -E '^Building [^ ]+:x64-windows@' build.log | sed -E 's/^Building ([^@]+)@.*/\1/' || true)
          {
            echo "### vcpkg binary feed"
            echo "Restored from the feed: ${restored:-0}"
            if [ -n "$built" ]; then
              echo "Built from source: $(echo "$built" | wc -l)"
              echo "$built" | sed 's/^/- /'
            else
              echo "Built from source: 0"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$built" ]; then
            echo "::warning title=vcpkg built ports from source::$(echo "$built" | paste -sd, -) missing from the feed; this run is slow, the next one will reuse them"
          fi

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      # Fails the job if an object served from the cache differs from a fresh compile of the same
      # command. Before the save, so a cache that returned a wrong object is not kept.
      - name: Verify the compiler cache
        run: python scripts/verify_compiler_cache.py --preset windows-ninja-msvc-dx12-debug

      # A game consuming the build above rather than compiling the engine into its own: the package
      # links, the runtime DLLs stage beside it, and the executable starts. One translation unit.
      - name: Consume the engine package
        run: python scripts/embed.py --package --preset windows-ninja-msvc-dx12-debug

      # ccache keeps what it restored beside what it compiled. A hit refreshes an entry's timestamp,
      # so one older than the stamp is one this run neither made nor used.
      - name: Drop the objects this run did not use
        if: ${{ success() && steps.ccache.outputs.cache-hit != 'true' }}
        shell: bash
        run: ccache --evict-older-than "$(( $(date +%s) - COMPILES_STARTED ))s"

      - name: Save the compiler cache
        if: ${{ success() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-msvc-${{ github.sha }}

  macos:
    name: compile (macos-clang, Debug + Metal)
    # A train's push builds for the compiler cache its pull requests read, and this job has none.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'push' || github.ref == 'refs/heads/master') }}
    runs-on: macos-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      # No LFS: every job compiles and none runs a suite, so assets/ is only staged, never read.
      # A job that runs one needs the BERNINI_LFS_* secrets and a `git lfs pull`, not
      # `lfs: true` -- the objects are in this project's own bucket. See docs/lfs.md.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vcpkg's catch2 port calls vcpkg_fixup_pkgconfig on Unix, which fails outright without
      # pkg-config. Probed by binary rather than by formula name: `brew install pkg-config`
      # installs the `pkgconf` formula, so a formula-name check would miss it.
      - name: Install build tools
        run: |
          set -euo pipefail
          command -v ninja      >/dev/null || brew install ninja
          command -v pkg-config >/dev/null || brew install pkg-config

      # As on Windows, the preset resolves its toolchain through $env{VCPKG_ROOT}. The macOS
      # image is not guaranteed to ship vcpkg, so clone it when the runner exports nothing.
      # The clone must NOT be shallow: vcpkg.json pins builtin-baseline, and a --depth 1 clone
      # would not contain that commit for vcpkg to resolve.
      - name: Point VCPKG_ROOT at a vcpkg
        run: |
          set -euo pipefail
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "${VCPKG_INSTALLATION_ROOT}" ]; then
            echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          else
            git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
            "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # A key naming the runner image, because a package's vcpkg ABI covers the compiler and the
      # image ships it. `${{ env.ImageVersion }}` cannot reach it -- the env context sees this
      # workflow's own `env:` blocks only -- so it is re-exported through $GITHUB_ENV. This job still
      # caches through actions/cache, whose entries are scoped to the ref that saved them; the
      # Windows job moved to a package feed for that reason (NuGet needs mono here).
      - name: Put the runner image in reach of the cache key
        run: echo "IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # vcpkg.json carries the builtin-baseline, so hashing it keys the whole dep set; the overlay
      # ports and the preset's triplet are the rest of what the plan is built from.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-${{ env.IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'CMakePresets.json') }}
          restore-keys: vcpkg-arm64-osx-${{ env.IMAGE }}-

      # What keeps core and assetlib building under a non-MSVC compiler on a non-Windows host.
      # It builds them with a backend rather than without one: the backend-free macOS preset this
      # used to run first is gone.
      - name: Build (Metal)
        run: python scripts/build.py --preset macos-clang-metal-debug

      - name: Consume the engine package
        run: python scripts/embed.py --package --preset macos-clang-metal-debug

      # Named after its contents, not after what we believe determines them: an ABI input the key
      # above forgets still moves the digest, so the rebuild is saved instead of wedging the cache.
      - name: Key the binaries by what is in them
        if: ${{ !cancelled() }}
        run: echo "VCPKG_CACHE_KEY=${{ steps.vcpkg-cache.outputs.cache-primary-key }}-${{ hashFiles('.vcpkg-cache/**') }}" >> "$GITHUB_ENV"

      # Saved on failure too: vcpkg writes each package as it completes, so a build that died
      # later still leaves binaries a retry can use.
      - name: Save vcpkg binaries
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-matched-key != env.VCPKG_CACHE_KEY }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
