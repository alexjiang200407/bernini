name: CI

on:
  pull_request:
  push:
    branches: [master]

# A PR gets one review-worthy result, not one per intermediate push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile (ninja-msvc, Debug)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The vcpkg preset resolves its toolchain through $env{VCPKG_ROOT}; the runner
      # image ships vcpkg but exports it as VCPKG_INSTALLATION_ROOT.
      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # Without this every run rebuilds slang, ktx, sdl3 and the rest from source.
      # vcpkg.json carries the builtin-baseline, so hashing it keys the whole dep set --
      # but a package's vcpkg ABI also covers the compiler, so ImageVersion has to be in
      # the key too. Left out, a runner-image bump keeps hitting the old key: vcpkg finds
      # no usable ABI inside and rebuilds everything, and actions/cache skips the save
      # because the key was a hit, so the rebuild repeats on every run from then on.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-windows-${{ env.ImageVersion }}-
            vcpkg-x64-windows-

      # Compile only: the ninja-msvc-debug preset has BUILD_TESTS=ON, so the suites are
      # built but never run -- they need a GPU and a machine this runner isn't. Qt is
      # absent, so apps/editor is skipped (CMakeLists.txt find_package(Qt6 QUIET)).
      # build.py locates vcvars via vswhere when config.json is absent, as it is here.
      - name: Build
        run: python scripts/build.py --preset windows-ninja-msvc-dx12-debug

  macos:
    name: compile (macos-clang, Debug + Metal)
    runs-on: macos-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      # No LFS: every job compiles and none runs a suite, so assets/ is only staged, never read.
      # A job that runs one needs the BERNINI_LFS_* secrets and a `git lfs pull`, not
      # `lfs: true` -- the objects are in this project's own bucket. See docs/lfs.md.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vcpkg's catch2 port calls vcpkg_fixup_pkgconfig on Unix, which fails outright without
      # pkg-config. Probed by binary rather than by formula name: `brew install pkg-config`
      # installs the `pkgconf` formula, so a formula-name check would miss it.
      - name: Install build tools
        run: |
          set -euo pipefail
          command -v ninja      >/dev/null || brew install ninja
          command -v pkg-config >/dev/null || brew install pkg-config

      # As on Windows, the preset resolves its toolchain through $env{VCPKG_ROOT}. The macOS
      # image is not guaranteed to ship vcpkg, so clone it when the runner exports nothing.
      # The clone must NOT be shallow: vcpkg.json pins builtin-baseline, and a --depth 1 clone
      # would not contain that commit for vcpkg to resolve.
      - name: Point VCPKG_ROOT at a vcpkg
        run: |
          set -euo pipefail
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "${VCPKG_INSTALLATION_ROOT}" ]; then
            echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          else
            git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
            "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-arm64-osx-${{ env.ImageVersion }}-
            vcpkg-arm64-osx-

      # What keeps core and assetlib building under a non-MSVC compiler on a non-Windows host.
      # It builds them with a backend rather than without one: the backend-free macOS preset this
      # used to run first is gone.
      - name: Build (Metal)
        run: python scripts/build.py --preset macos-clang-metal-debug
